{% extends "base.html" %}

{% block title %}Tum Kitaplar | DIPNOT{% endblock %}

{% block content %}
<section class="bestseller-section">
    <div class="bestseller-header">
        <div class="bestseller-sub">DIPNOT. Kutuphane</div>
        <h2 class="section-title">TUM KITAPLAR</h2>
    </div>

    <div class="all-books-grid">
        {% for book in books %}
        <div class="book-card">
            <img src="{{ book['image_path'] or book['image_url'] }}" alt="{{ book['title'] }}">
            <div class="book-title">{{ book["title"] }}</div>
            <div class="book-author">{{ book["author"] }}</div>
            <div class="book-price">{{ "%.2f"|format(book["price"]) }} TL</div>
            <div class="book-actions">
                <a class="mini-btn" href="{{ url_for('book_detail', book_id=book['id']) }}">Detayi Gor</a>
                <form method="post" action="{{ url_for('add_to_cart', book_id=book['id']) }}">
                    <button type="submit" class="mini-btn primary">Sepete Ekle</button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
